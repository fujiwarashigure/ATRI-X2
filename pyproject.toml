[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atri-x"
version = "1.1.1"
description = "ATRI-X 的 Python 全量重写：多平台 LLM Agent 守护进程"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ATRI-X2-Py port" }]
keywords = ["llm", "agent", "bot", "asyncio", "sqlite"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
# 运行时零第三方**代码**依赖。Pillow 是可选加速后端（图像编解码），缺失时走纯 Python 后备。
#
# 唯一的必需依赖是 tzdata（1.0.10 起）：它是**纯数据包**（IANA 时区库），不含可执行
# 代码。Windows 没有系统 zoneinfo（zoneinfo.TZPATH 为空），[time].timezone 里的 IANA
# 名只能靠它；冻结版由 packaging/atri-x.spec 显式收集并做构建期断言，缺数据时构建失败。
dependencies = ["tzdata>=2024.1"]

[project.optional-dependencies]
imaging = ["Pillow>=10"]
dev = []

[project.scripts]
# 真正的入口是 ``atri_x/__main__.py``（``python -m atri_x`` 的同一份）；
# ``atri_x.launcher.cli`` 只导出参数解析与用法文本，没有 ``main``。
atri-x = "atri_x.__main__:main"
# 桌面端（Tk + 托盘）：`pip install` 后直接敲 `atri-x-gui`；与冻结版 atri-x-gui.exe 同入口。
atri-x-gui = "atri_x.gui.__main__:main"

[tool.setuptools]
packages = { find = { include = ["atri_x*"] } }
