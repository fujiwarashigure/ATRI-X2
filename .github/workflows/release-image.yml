# 构建并发布容器镜像到 GitHub Container Registry（ghcr.io）。
#
# 触发条件：
#   - 推送 v* tag（发版主路径）
#   - 在 GitHub 上发布 Release
#   - 手动 workflow_dispatch
#
# 产物：ghcr.io/<owner>/<repo>:<deploy/VERSION> 与 :latest。
# 推完会**回拉镜像**跑一次 `python -m atri_x --version` 做冒烟，避免"推上去的是坏镜像"。
#
# 需要的权限：仓库默认的 GITHUB_TOKEN + `packages: write`（见下方 permissions）。
# 包的可见性默认是 private；最后一步会尝试改成 public，失败不影响发布。
name: container-image

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n' < deploy/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          provenance: true
          sbom: true

      - name: Pull back and smoke-test the published image
        run: |
          set -eux
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.version.outputs.version }}"
          docker pull "$image"
          docker run --rm --entrypoint python "$image" -m atri_x --version
          docker run --rm --entrypoint python "$image" -m atri_x --health-probe >/dev/null || true

      - name: Try to make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          name="${GITHUB_REPOSITORY#*/}"
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${name}" \
            -d '{"visibility":"public"}' || true
