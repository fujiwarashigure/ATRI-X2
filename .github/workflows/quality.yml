# 质量门禁：每次 push / PR 都跑代码门禁 + 文档门禁 + 全量单测。
#
# 本工作流不需要第三方依赖（纯标准库 + 自带脚本），因此不装 requirements，
# 只用 runner 自带的 python3。
#
# 为什么拆成两个 job、单测再拆 6 片：
#   - 旧版是**一个 job**：先跑 12 道门禁，再跑 `python -m unittest discover -s tests -t . -v`。
#     全量 7,167 个用例在托管 runner 上要 45 分钟以上，反复出现
#     「The hosted runner lost communication with the server」——步骤永远停在 in_progress、
#     job 却已经结束。这不是用例失败，是长任务把 runner 拖失联，整条门禁因此常年红。
#   - 现在门禁（约 40 秒）与单测并行；单测用 `scripts/ci_shard_tests.py` 按「模块实测耗时」
#     （`scripts/ci_test_weights.json`，缺项按用例数估）**确定性**均分成 6 片（只依赖 tests/
#     与标准库，各片自己算出同一份划分），单片约 6–10 分钟，runner 不再被单个长任务拖失联，
#     红了也能一眼定位到片。
#   - gates 里的「分片计划自检」会断言 6 片**恰好覆盖全部测试模块且用例数守恒**，
#     以后加/删测试模块不会悄悄漏跑。
#   - runner 固定 `ubuntu-24.04`（而不是 `ubuntu-latest`）：避免镜像轮换把门禁结果变成
#     「今天过、明天挂」的玄学。
name: quality

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只保留最新一次运行：旧运行还在跑长任务时直接取消，省 runner 也省排队。
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: code + docs gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法 / 编码 / BOM / CRLF（check_syntax）
        run: python scripts/check_syntax.py

      - name: 逐模块导入（check_imports）
        run: python scripts/check_imports.py

      - name: 跨模块契约（check_integration）
        run: python scripts/check_integration.py

      - name: 秘密扫描（check_secrets）
        run: python scripts/check_secrets.py

      - name: 异常处理棘轮（check_except）
        run: python scripts/check_except.py

      - name: PORTING 覆盖（check_coverage）
        run: python scripts/check_coverage.py

      - name: 生成索引不漂移（gen_index --check）
        run: python scripts/gen_index.py --check

      - name: README 数字与实测一致（gen_stats --check）
        run: python scripts/gen_stats.py --check

      - name: 随包 draw.io 技能摘要（gen_drawio_pack --check）
        run: python scripts/gen_drawio_pack.py --check

      - name: 文档门禁（check_docs）
        run: python scripts/check_docs.py

      - name: 复杂度预算（complexity_budget.json）
        run: python scripts/check_complexity.py

      - name: 测试分片计划自检（覆盖 + 均衡）
        run: python scripts/ci_shard_tests.py --plan

  tests:
    name: unittest shard ${{ matrix.shard }}/6
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 全量单测（分片 ${{ matrix.shard }}/6）
        run: |
          set -o pipefail
          python scripts/ci_shard_tests.py --shard "${{ matrix.shard }}/6" \
            2>&1 | tee "unittest-shard-${{ matrix.shard }}.log"

      - name: 失败时上传本片日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-shard-${{ matrix.shard }}-log
          path: unittest-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7
